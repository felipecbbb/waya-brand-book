<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Surfcamps por el mundo | Viajes de Surf - Waya Surf School</title>
    <meta name="description"
        content="Surfcamps de Waya Surf School: viajes de surf por Canarias, Marruecos y más destinos. Olas nuevas, comunidad y desconexión. Consulta fechas, precios y plazas.">
    <meta name="keywords"
        content="surfcamp, viaje de surf, surfcamp marruecos, surfcamp canarias, surf trip, campamento de surf">
    <link rel="canonical" href="https://wayasurf.com/surfcamps.html">
    <link rel="icon" type="image/png" href="images/favicon-waya.png">
    <link
        href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;700;800;900&family=Inter:wght@300;400;500;600&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="css/styles.css">
    <link rel="stylesheet" href="css/i18n.css">
    <link rel="stylesheet" href="css/surfcamps.css">
    <script>
      // Evita el destello al abrir el detalle de un camp: el CSS trae una foto
      // genérica de fondo y el JS la sustituye por la del camp unos cientos de
      // ms después, así que se veía primero una imagen y luego otra. Si la URL
      // ya dice que vamos a un camp concreto, se marca el <html> para que el
      // hero arranque sin foto (solo el degradado) hasta saber cuál toca.
      if (new URLSearchParams(location.search).get('camp')) {
        document.documentElement.classList.add('sc-awaiting-hero');
      }
    </script>
</head>

<body>
    <!-- Header -->
    <div id="header-placeholder"></div>

    <!-- Hero (dinámico: el listado usa el genérico; el detalle lo reemplaza) -->
    <section class="sc-hero" data-sc-hero>
        <div class="sc-hero-overlay"></div>
        <div class="sc-hero-inner">
            <span class="sc-hero-kicker" data-sc-hero-kicker>Surfcamps</span>
            <h1 class="sc-hero-title" data-sc-hero-title data-i18n="seo.camps_title">Vive el surf por el mundo</h1>
            <p class="sc-hero-sub" data-sc-hero-sub data-i18n="seo.camps_sub">Viajes de surf con la familia Waya. Elige tu próxima edición.</p>
            <div class="sc-hero-tags" data-sc-hero-tags></div>
        </div>
        <div class="sc-hero-scroll" aria-hidden="true"><span></span></div>
    </section>

    <!-- Contenido dinámico (listado o detalle) -->
    <div id="surfcamps-root"></div>

    <!-- Footer -->
    <div id="footer-placeholder"></div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/ScrollTrigger.min.js"></script>
    <script src="js/translations.js"></script>
    <script src="js/i18n.js"></script>
    <script src="js/script.js"></script>
    <script type="module" src="/lib/supabase-global.js"></script>
    <script src="js/components.js"></script>
    <script type="module" src="/lib/surfcamps.js"></script>
</body>

</html>
