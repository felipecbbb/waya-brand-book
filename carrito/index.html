<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <!-- La página se sirve en /carrito/ (subcarpeta). base=/ hace que el fetch de
         components.js y los enlaces/imágenes relativos del header/footer globales
         resuelvan contra la raíz del sitio, no contra /carrito/. -->
    <base href="/">
    <title>Tu carrito | Waya Surf School</title>
    <meta name="description" content="Revisa tu carrito de Waya Surf School: clases, alquiler de material, surfcamps y productos antes de finalizar tu compra.">
    <meta name="robots" content="noindex, nofollow">

    <!-- Favicon -->
    <link rel="icon" type="image/png" href="/images/waya-isotipo.png">

    <!-- Fonts (Outfit + Inter, como el resto del sitio) -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;700;800;900&family=Inter:wght@300;400;500;600&display=swap"
        rel="stylesheet">

    <!-- CSS del sitio Waya -->
    <link rel="stylesheet" href="/css/styles.css?v=btn_yellow">
    <link rel="stylesheet" href="/css/reservas.css">
    <link rel="stylesheet" href="/css/i18n.css">

    <!-- Estilos propios de la página de carrito (tabla completa).
         reservas.css ya trae las clases .cart-drawer-* del panel lateral;
         aquí definimos la vista de tabla de la página /carrito/. -->
    <style>
        .cart-page {
            padding: 140px 0 80px;
            min-height: 60vh;
        }

        .cart-page-head {
            margin-bottom: 32px;
        }

        .cart-page-kicker {
            display: inline-block;
            font-family: 'Outfit', sans-serif;
            font-weight: 700;
            font-size: .8rem;
            letter-spacing: .12em;
            text-transform: uppercase;
            color: var(--color-gray);
            margin-bottom: 8px;
        }

        .cart-page-title {
            font-family: 'Outfit', sans-serif;
            font-weight: 800;
            font-size: clamp(2rem, 5vw, 2.8rem);
            color: var(--color-dark);
            line-height: 1.05;
        }

        /* --- Estado vacío --- */
        .cart-empty {
            text-align: center;
            padding: 60px 20px;
            background: var(--color-light-gray);
            border-radius: 16px;
        }

        .cart-empty h2 {
            font-family: 'Outfit', sans-serif;
            font-weight: 700;
            font-size: 1.5rem;
            color: var(--color-dark);
            margin-bottom: 10px;
        }

        .cart-empty p {
            color: var(--color-gray);
            margin-bottom: 24px;
        }

        /* --- Tabla --- */
        .cart-table-wrap {
            overflow-x: auto;
            -webkit-overflow-scrolling: touch;
            border: 1px solid #ececec;
            border-radius: 16px;
        }

        .cart-table {
            width: 100%;
            border-collapse: collapse;
            min-width: 640px;
        }

        .cart-table thead th {
            text-align: left;
            font-family: 'Outfit', sans-serif;
            font-weight: 700;
            font-size: .78rem;
            letter-spacing: .06em;
            text-transform: uppercase;
            color: var(--color-gray);
            padding: 16px 18px;
            border-bottom: 1px solid #ececec;
            background: #fafafa;
        }

        .cart-table tbody td {
            padding: 18px;
            border-bottom: 1px solid #f0f0f0;
            vertical-align: middle;
            color: var(--color-dark);
        }

        .cart-table tbody tr:last-child td {
            border-bottom: none;
        }

        .cart-item-name {
            font-family: 'Outfit', sans-serif;
            font-weight: 700;
            font-size: 1rem;
            color: var(--color-dark);
        }

        .cart-item-note {
            display: block;
            font-size: .82rem;
            color: var(--color-gray);
            margin-top: 3px;
        }

        /* --- Badge de tipo --- */
        .type-badge {
            display: inline-block;
            margin-top: 8px;
            padding: 3px 10px;
            border-radius: 999px;
            font-family: 'Outfit', sans-serif;
            font-weight: 700;
            font-size: .68rem;
            letter-spacing: .04em;
            text-transform: uppercase;
        }

        .type-badge.product { background: #eef2ff; color: #4338ca; }
        .type-badge.class_reservation { background: var(--color-primary); color: var(--color-dark); }
        .type-badge.rental { background: #e0f2fe; color: #0369a1; }
        .type-badge.camp { background: #ffedd5; color: #c2410c; }

        /* --- Controles de cantidad --- */
        .qty-controls {
            display: inline-flex;
            align-items: center;
            gap: 4px;
            border: 1px solid #e0e0e0;
            border-radius: 10px;
            padding: 2px;
        }

        .qty-btn {
            width: 30px;
            height: 30px;
            border: none;
            background: var(--color-light-gray);
            border-radius: 8px;
            font-size: 1.1rem;
            font-weight: 700;
            color: var(--color-dark);
            cursor: pointer;
            line-height: 1;
            transition: background .15s;
        }

        .qty-btn:hover { background: #ececec; }

        .qty-val {
            min-width: 34px;
            text-align: center;
            font-weight: 700;
            color: var(--color-dark);
        }

        .cart-line-total { font-weight: 800; white-space: nowrap; }

        .cart-remove {
            border: none;
            background: none;
            color: #b91c1c;
            font-family: 'Inter', sans-serif;
            font-size: .85rem;
            font-weight: 600;
            cursor: pointer;
            padding: 4px 2px;
        }

        .cart-remove:hover { text-decoration: underline; }

        /* --- Resumen / totales --- */
        .cart-summary {
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            justify-content: flex-end;
            gap: 14px;
            margin-top: 28px;
        }

        .cart-total {
            margin-right: auto;
            font-family: 'Outfit', sans-serif;
            font-weight: 800;
            font-size: 1.35rem;
            color: var(--color-dark);
        }

        .cart-total span { color: var(--color-gray); font-weight: 600; font-size: 1rem; }

        /* --- Pantalla de éxito (?success=1 / ?pago=ok) --- */
        .cart-success {
            text-align: center;
            padding: 60px 20px;
            background: var(--color-light-gray);
            border-radius: 16px;
        }

        .cart-success-icon {
            width: 72px;
            height: 72px;
            margin: 0 auto 20px;
            border-radius: 50%;
            background: var(--color-primary);
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .cart-success h2 {
            font-family: 'Outfit', sans-serif;
            font-weight: 800;
            font-size: 1.8rem;
            color: var(--color-dark);
            margin-bottom: 10px;
        }

        .cart-success p {
            color: var(--color-gray);
            max-width: 460px;
            margin: 0 auto 24px;
        }

        @media (max-width: 600px) {
            .cart-page { padding: 120px 0 60px; }
            .cart-summary { justify-content: stretch; }
            .cart-summary .btn { flex: 1 1 100%; text-align: center; }
            .cart-total { margin-right: 0; flex: 1 1 100%; text-align: center; margin-bottom: 8px; }
        }
    </style>
</head>

<body>
    <!-- Header global del sitio (inyectado por components.js) -->
    <div id="header-placeholder"></div>

    <!-- SEO H1 oculto -->
    <h1 style="position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);border:0;">
        Tu carrito - Waya Surf School
    </h1>

    <!-- Contenedor del carrito: lo rellena carrito.js -->
    <main class="cart-page">
        <div class="container">
            <div class="cart-page-head">
                <span class="cart-page-kicker" data-i18n="carrito.kicker">Tu pedido</span>
                <p class="cart-page-title" data-i18n="carrito.title">Carrito</p>
            </div>
            <div id="cart-content"></div>
        </div>
    </main>

    <!-- Footer global del sitio (inyectado por components.js) -->
    <div id="footer-placeholder"></div>

    <!-- Globales públicos: deben cargar ANTES del módulo del carrito -->
    <script src="/js/translations.js?v=2"></script>
    <script src="/js/i18n.js?v=2"></script>
    <script src="/js/components.js"></script>

    <!-- Núcleo de la página de carrito -->
    <script type="module" src="/carrito/carrito.js"></script>
</body>

</html>
